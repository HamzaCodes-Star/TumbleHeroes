name: 🎮 Build Android APK (Tumble Heroes)

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Custom Build Label'
        required: false
        default: 'Cloud_Build'
  push:
    tags:
      - 'v*'

jobs:
  export-android:
    name: 🤖 Godot Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Android Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: 📦 Export Android APK
        run: |
          mkdir -p build/
          godot -v --headless --export-debug "Android" build/TumbleHeroes.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TumbleHeroes-Android-APK
          path: build/TumbleHeroes.apk
          retention-days: 14
