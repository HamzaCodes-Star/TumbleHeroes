<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Crown -->
  <polygon points="180,180 210,130 256,170 302,130 332,180" fill="url(#crownGrad)" stroke="#FFF" stroke-width="6" stroke-linejoin="round" />
  <circle cx="210" cy="130" r="10" fill="#E91E63" />
  <circle cx="256" cy="170" r="10" fill="#00E676" />
  <circle cx="302" cy="130" r="10" fill="#E91E63" />

  <!-- Bean Character Head/Body -->
  <ellipse cx="256" cy="290" rx="115" ry="140" fill="url(#beanGrad)" stroke="#FFF" stroke-width="8" />

  <!-- Big Cartoon Eyes -->
  <ellipse cx="215" cy="260" rx="28" ry="38" fill="#FFFFFF" stroke="#333" stroke-width="5" />
  <ellipse cx="297" cy="260" rx="28" ry="38" fill="#FFFFFF" stroke="#333" stroke-width="5" />
  
  <!-- Pupils -->
  <circle cx="222" cy="262" r="14" fill="#1A1A1A" />
  <circle cx="290" cy="262" r="14" fill="#1A1A1A" />
  
  <!-- Catchlight Sparkles -->
  <circle cx="226" cy="256" r="5" fill="#FFFFFF" />
  <circle cx="294" cy="256" r="5" fill="#FFFFFF" />

  <!-- Big Playful Smile -->
  <path d="M 215 325 Q 256 370 297 325" fill="none" stroke="#212121" stroke-width="8" stroke-linecap="round" />
</svg>
